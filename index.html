<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NanoTech — Ремонт та продаж</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="favicon.ico">
</head>
<body>
    <div class="canvas">
        <div class="grid-container">
            <header class="header"><h1>NanoTech</h1></header>
            <section class="subheader"><h3>Premium Smartphone Service</h3></section>

            <nav class="menu">
                <a href="#" class="menu-item active">Головна</a>
                <a href="#" class="menu-item">Каталог</a>
                <a href="#" class="menu-item">Послуги</a>
                <a href="#" class="menu-item">Гарантія</a>
            </nav>

            <aside class="sidebar-left">
                <div class="img-zoom"><img src="img/p1.jpg" alt="iPhone"></div>
                <div class="img-zoom"><img src="img/p2.jpg" alt="Samsung"></div>
                <div class="img-zoom"><img src="img/p3.jpg" alt="Pixel"></div>
            </aside>

            <main class="main-content">
                <h2>Професійний ремонт гаджетів</h2>
                <p>Ми займаємося відновленням техніки будь-якої складності. Від заміни скла до пайки материнських плат.</p>
                <div class="card">
                    <h4>Терміновий викуп</h4>
                    <p>Оцінка вашого пристрою за 5 хвилин.</p>
                </div>
            </main>

            <aside class="sidebar-right">
                <div class="img-zoom"><img src="img/p4.jpg" alt="Tools"></div>
                <div class="img-zoom"><img src="img/p5.jpg" alt="Parts"></div>
                <div class="img-zoom"><img src="img/p6.jpg" alt="Service"></div>
            </aside>

            <footer class="footer">
                <p>© 2026 NanoTech. Працюємо без вихідних.</p>
            </footer>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
